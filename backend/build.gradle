plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.7'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.mathworksheet'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'com.h2database:h2'

    // 빈칸 채우기(8장), 역변환 비교(8장)
    implementation 'org.apache.poi:poi-ooxml:5.4.1'
    implementation 'io.github.java-diff-utils:java-diff-utils:4.15'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// /worksheet(형식 파일·Lua 필터·샘플 원고)가 단일 원본이다. 백엔드 리소스로 복사한다(15장).
processResources {
    from('../worksheet') {
        into 'worksheet'
        exclude '**/.gitkeep'
    }
}

springBoot {
    buildInfo()
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// 스킬 스크립트가 앱과 같은 Word 생성·검증 로직을 쓰도록 하는 개발용 명령줄 도구(설계서 15장)
// 예: ./gradlew -q docxTool --args="verify --manuscript m.md --docx out.docx"
tasks.register('docxTool', JavaExec) {
    group = 'worksheet'
    description = '문제지 생성·역변환 비교·형식 파일 검사 CLI'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.mathworksheet.worksheet.cli.WorksheetCli'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    workingDir = rootProject.projectDir
    jvmArgs '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'
    // 검사 불일치(종료 코드 1)를 Gradle 실패로 보이지 않게 한다. 스크립트는 마지막 줄 'exit=N'으로 결과를 읽는다
    ignoreExitValue = true
}

// 1단계 OCR·분할 검증 도구(mathpix-ocr, split-eval 스킬이 부른다). 작업 폴더가 backend라 ./application-local.yml을 읽는다
tasks.register('ocrTool', JavaExec) {
    group = 'ocr'
    description = 'Mathpix 호출·문제 나누기·분할 정확도 CLI'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.mathworksheet.ocr.cli.OcrCli'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(21) }
    workingDir = rootProject.projectDir
    jvmArgs '-Dstdout.encoding=UTF-8', '-Dstderr.encoding=UTF-8'
    ignoreExitValue = true
}
