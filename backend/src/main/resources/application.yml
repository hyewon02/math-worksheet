app:
  # 런타임 데이터 위치(10장). 업데이트·재설치에도 문제은행이 남도록 설치 폴더 밖에 둔다.
  data-dir: ${APPDATA:${user.home}}/MathWorksheet
  mathpix:
    app-id:
    app-key:
  pandoc:
    path: pandoc
    timeout: 60s
  # 문제지 머리말의 학원명. 설정 화면이 생기면 settings.json 값이 우선한다
  academy-name: 수학학원

server:
  port: 8080

spring:
  application:
    name: math-worksheet
  config:
    # 개발자 키는 git에서 제외한 backend/application-local.yml에 둔다(10장)
    import: optional:file:./application-local.yml
  datasource:
    url: jdbc:h2:file:${app.data-dir}/db/worksheet
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 30MB
      max-request-size: 2GB
