# 빌드·테스트. Windows 설치 파일(jpackage + WiX) 생성은 로드맵 6단계에서 추가한다.
name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Word 생성 테스트(PandocRunner·역변환 비교)가 pandoc을 실제로 실행한다. 없으면 테스트가 건너뛰어지므로 설치를 확인한다
      - name: Pandoc 설치
        run: |
          choco install pandoc -y --no-progress
          echo "C:\Program Files\Pandoc" >> $env:GITHUB_PATH

      - name: Pandoc 확인
        run: pandoc --version

      - name: 프론트엔드 빌드
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: 백엔드 테스트
        working-directory: backend
        run: ./gradlew.bat build
